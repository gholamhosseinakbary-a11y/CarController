name: Build Android APK

# =====================================================================
# ساخت APK بدون Android Studio — GitHub Actions (مرحلهٔ ۴)
# ---------------------------------------------------------------------
# پس از push (یا اجرای دستی):
#   ۱) APK دیباگ:  app/build/outputs/apk/debug/app-debug.apk
#   ۲) APK امضاشده release: app/build/outputs/apk/release/app-release.apk
# هر دو به‌عنوان Artifact قابل دانلود هستند (تب Actions ← آخرین اجرا).
# این ورک‌فلو «خودش» محل پروژهٔ گریدل را پیدا می‌کند (android-app / ریشه /
# CarController-VPS/android-app) تا ساختار آپلود باعث خطا نشود.
# =====================================================================

on: [push, workflow_dispatch]

jobs:
  build:
    name: Assemble APK (debug + signed release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # پیدا کردن محل پروژهٔ گریدل — مقاوم در برابر هر چیدمان آپلود
      - name: Locate Gradle project
        id: locate
        run: |
          set -e
          echo "=== فهرست فایل‌های سطح اول ==="
          ls -la
          echo "=== جست‌وجوی settings.gradle.kts ==="
          find . -name settings.gradle.kts -not -path "./.git/*" || true
          if [ -f android-app/settings.gradle.kts ]; then
            DIR=android-app
          elif [ -f settings.gradle.kts ] && [ -f app/build.gradle.kts ]; then
            DIR=.
          elif [ -f CarController-VPS/android-app/settings.gradle.kts ]; then
            DIR=CarController-VPS/android-app
          else
            echo "::error::پوشهٔ پروژهٔ اندروید پیدا نشد — settings.gradle.kts در ریپو نیست؛ پوشهٔ android-app را آپلود کنید"
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "پروژهٔ گریدل در: $DIR"

      - name: Build APKs (debug + signed release)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: CarController-APK
          retention-days: 30
          path: |
            ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/app-release.apk
